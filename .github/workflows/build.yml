name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64,  exe: build/rattle.exe, gen: -G "MinGW Makefiles" }
          - { os: macos-latest,   name: macos-arm64,  exe: build/rattle }
          - { os: ubuntu-latest,  name: linux-x64,    exe: build/rattle }
          - { os: ubuntu-24.04-arm, name: linux-arm64-pi, exe: build/rattle }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The Rattlegram modem code needs GCC or Clang (not MSVC), so Windows builds with MinGW.
      - run: cmake -S . -B build ${{ matrix.gen }} -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release -j 4
      - name: loopback test
        shell: bash
        run: |
          ${{ matrix.exe }} send "loopback test de KN0BLE" --callsign KN0BLE --wav t.wav
          ${{ matrix.exe }} listen --wav t.wav | grep "loopback test de KN0BLE"
      - uses: actions/upload-artifact@v4
        with:
          name: rattle-${{ matrix.name }}
          path: |
            ${{ matrix.exe }}
            examples/
            README.md

  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - run: mac/build-app.sh
      - name: test bundled receiver (JSON events the app reads)
        run: |
          R="mac/build/Radio Messages.app/Contents/MacOS/rattle"
          "$R" send "Radio Messages test" --callsign KN0BLE --wav t.wav
          "$R" listen --wav t.wav --format json --names KN0BLE=Josh | tee out.json
          grep '"event":"message","from":"KN0BLE","name":"Josh","text":"Radio Messages test"' out.json
      - name: launch smoke test (app must stay running)
        run: |
          "mac/build/Radio Messages.app/Contents/MacOS/RadioMessages" > app.log 2>&1 &
          PID=$!
          sleep 10
          kill -0 $PID && echo "app running after 10 s"
          kill $PID || true
          cat app.log
      - name: screenshot with a test message
        run: |
          R="mac/build/Radio Messages.app/Contents/MacOS/rattle"
          "$R" send "Truck broke down near Wekiwa Springs. I'm safe. Call Dad to pick me up at the main gate." --callsign KN0BLE --wav msg.wav
          RADIO_MESSAGES_TEST_WAV="$PWD/msg.wav" "mac/build/Radio Messages.app/Contents/MacOS/RadioMessages" &
          sleep 12
          screencapture -x screenshot.png
          kill %1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
      - name: package
        run: cd mac/build && ditto -c -k --keepParent "Radio Messages.app" "Radio-Messages.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Radio-Messages-mac
          path: mac/build/Radio-Messages.zip
