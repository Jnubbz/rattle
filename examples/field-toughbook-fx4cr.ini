# rattle.ini — FIELD: Toughbook (Windows) + FX-4CR running fx4cr-open
# Copy this file next to rattle.exe and rename it rattle.ini.

callsign = KN0BLE

# Audio: part of the device name as shown by "rattle devices" (or its number).
# The FX-4CR's built-in sound card usually shows as "USB Audio" / "Speakers (USB Audio Device)".
input  = USB Audio
output = USB Audio

# PTT over CAT. Find the COM port in Device Manager > Ports (COM & LPT).
# Close WSJT-X/loggers first: only one program can hold the port.
ptt     = cat
port    = COM5
baud    = 115200
cat_on  = TX;
cat_off = RX;

# Put the radio in DIG mode (USB side). fx4cr-open holds DIG to 10 W.
# Start low and raise until the far end decodes; keep ALC quiet.
level   = 0.5
carrier = 1500

lead_ms  = 150
tail_ms  = 100
max_tx_s = 8
noise    = 1

log = rattle-log.txt
