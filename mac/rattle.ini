# Radio Messages — receiver settings (receive only; this app never transmits)
# Lives in ~/Library/Application Support/Radio Messages/rattle.ini
# (menu: Radio Messages > Open Settings Folder). Restart the app after editing.

# The radio's sound card, as listed by: rattle devices
input = USB Audio Device

# Who's who: callsign=Name shown in the window
names = KN0BLE=Josh

callsign = KN0BLE
ptt = none

# ---- Replies (for a licensed operator) -----------------------------------
# Leave ptt = none and the app is receive-only (no reply box).
# To enable the reply box, key the FT-710 by RTS on its Standard COM port:
#   radio: DATA-U, DATA "RPTT SELECT" = RTS, data audio source = USB
#   find the port: unplug/replug the FT-710 USB and compare `ls /dev/cu.*`
# ptt    = rts
# port   = /dev/cu.SLAB_USBtoUART8
# output = USB Audio Device
# level  = 0.4
