# rattle.ini — HOME: Mac mini M4 + FT-710
# Put this in the folder you run rattle from, named rattle.ini.

callsign = KN0BLE

# The FT-710's codec shows as "USB Audio CODEC" (run: ./rattle devices).
input  = USB Audio CODEC
output = USB Audio CODEC

# PTT: RTS on the FT-710's *Standard* COM port (Yaesu's "TX control" port).
#   Radio menu: the DATA/PSK mode "RPTT SELECT" = RTS, and data audio source = USB.
#   Ports: ls /dev/cu.*  -> the FT-710 shows two Silicon Labs ports; Standard is usually the second.
#   Quit WSJT-X first so the port is free. Check with: ./rattle ptt-test
ptt  = rts
port = /dev/cu.SLAB_USBtoUART3
baud = 38400

# Alternative: CAT PTT on the Enhanced port (the one WSJT-X uses for CAT).
# Verify with ./rattle ptt-test into a dummy load before trusting it.
# ptt     = cat
# port    = /dev/cu.SLAB_USBtoUART
# baud    = 38400
# cat_on  = TX1;
# cat_off = TX0;

# Radio in DATA-U. Raise level until the field station decodes, keep ALC quiet.
level   = 0.4
carrier = 1500

lead_ms  = 150
tail_ms  = 100
max_tx_s = 8
noise    = 1

log = rattle-log.txt

# Desktop notification on every received message (text arrives via env vars, never the command line):
on_message = osascript -e 'display notification (system attribute "RATTLE_TEXT") with title ("Rattlegram from " & (system attribute "RATTLE_FROM"))'

# Or a push to your phone with ntfy (pick a hard-to-guess topic):
# on_message = curl -s -d "$RATTLE_FROM: $RATTLE_TEXT" https://ntfy.sh/your-private-topic
